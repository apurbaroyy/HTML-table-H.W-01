<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Timetable</title>
<style>
    body{
        font-family: Arial, sans-serif;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        background:#f5f5f5;
    }

    table{
        border-collapse: collapse;
        width: 90%;
        max-width: 1000px;
        text-align: center;
        background: white;
        border: 3px solid black;
    }

    th, td{
        border: 1px solid black;
        padding: 10px;
        font-size: 18px;
    }

    th{
        font-weight: bold;
    }

    .break{
        writing-mode: vertical-rl;
        text-orientation: upright;
        font-weight: bold;
        letter-spacing: 5px;
    }

    .thesis{
        font-weight: bold;
    }
</style>
</head>
<body>

<table>
    <tr>
        <th rowspan="2">Days</th>
        <th colspan="6">Time</th>
    </tr>

    <tr>
        <th>8:00</th>
        <th>9:00</th>
        <th>10:00</th>
        <th>11:00</th>
        <th>11:30</th>
        <th>12:30</th>
    </tr>

    <tr>
        <td>Mon</td>
        <td>Course 1</td>
        <td>Course 2</td>
        <td>Course 3</td>
        <td rowspan="5" class="break">BREAK</td>
        <td>Course 5</td>
        <td></td>
    </tr>

    <tr>
        <td>Tue</td>
        <td colspan="2"></td>
        <td>Course 2</td>
        <td>Course 4</td>
        <td>Course 1</td>
    </tr>

    <tr>
        <td>Wed</td>
        <td>Course 3</td>
        <td colspan="2"></td>
        <td>Course 2</td>
        <td></td>
    </tr>

    <tr>
        <td>Thr</td>
        <td rowspan="2">Course 4</td>
        <td>Course 2</td>
        <td>Course 3</td>
        <td colspan="2" rowspan="2" class="thesis">Thesis</td>
    </tr>

    <tr>
        <td>Fri</td>
        <td></td>
        <td>Course 1</td>
    </tr>
</table>

</body>
</html>

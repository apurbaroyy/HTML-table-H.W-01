<!DOCTYPE html>
<html>
<head>
    <title>Business Table</title>
    <style>
        table {
            border-collapse: collapse;
            width: 90%;
            margin: 20px auto;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            font-weight: bold;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <th>Firm</th>
        <th>Org</th>
        <th>Lob</th>
        <th>Sub Lob</th>
        <th>Business Plans</th>
        <th>Business Components</th>
    </tr>

    <!-- First Section -->
    <tr>
        <td rowspan="11">XYZ</td>
        <td rowspan="6">CST</td>
        <td rowspan="3">CT</td>
        <td>ADS</td>
        <td>1</td>
        <td>10</td>
    </tr>
    <tr>
        <td>BTO</td>
        <td>2</td>
        <td>15</td>
    </tr>
    <tr>
        <td>CSI</td>
        <td>3</td>
        <td>6</td>
    </tr>
    <tr>
        <td rowspan="2">VCT</td>
        <td>ADS</td>
        <td>4</td>
        <td>10</td>
    </tr>
    <tr>
        <td>BTO</td>
        <td>5</td>
        <td>15</td>
    </tr>
    <tr>
        <td colspan="2">Sub Total</td>
        <td>6</td>
        <td>15</td>
    </tr>

    <!-- Second Section -->
    <tr>
        <td rowspan="5">CST</td>
        <td rowspan="3">CT</td>
        <td>ADS</td>
        <td>7</td>
        <td>10</td>
    </tr>
    <tr>
        <td>BTO</td>
        <td>8</td>
        <td>15</td>
    </tr>
    <tr>
        <td>CSI</td>
        <td>9</td>
        <td>6</td>
    </tr>
    <tr>
        <td>VCT</td>
        <td>ADS</td>
        <td>10</td>
        <td>10</td>
    </tr>
    <tr>
        <td colspan="2">Sub Total</td>
        <td>11</td>
        <td>15</td>
    </tr>

</table>

</body>
</html>
